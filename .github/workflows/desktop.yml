name: Build desktop game

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }} release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            label: Windows
            artifact: Windows-Build
          - os: ubuntu-latest
            platform: linux
            label: Linux
            artifact: Linux-Build
          - os: macos-latest
            platform: macos
            label: macOS
            artifact: Mac-Build
    env:
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Neutralino runtime resources
        run: npm run neutralino:update

      - name: Build release
        run: npm run neutralino:build

      - name: Package platform artifact
        run: npm run neutralino:package

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/platform-build
          if-no-files-found: error
