name: Build desktop game

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build Neutralino releases
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Neutralino runtime resources
        run: npm run neutralino:update

      - name: Build Windows, macOS, and Linux releases
        run: npm run neutralino:build

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: your-little-oyachi-desktop
          path: dist/**/*.zip
          if-no-files-found: error
